name: mobileapp
description: A Very Good Project created by Very Good CLI.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  auth_repository:
    path: packages/auth_repository
  bloc: ^9.2.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  geo_repository:
    path: packages/geo_repository
  geolocator_android: ^5.1.1
  geolocator_apple: ^2.3.14
  geolocator_platform_interface: ^4.4.0
  go_router: ^18.0.2
  intl: ^0.20.2
  material_ui: ^1.1.1
  profile_repository:
    path: packages/profile_repository
  property_repository:
    path: packages/property_repository
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/sora/OFL.txt
    - assets/fonts/hanken_grotesk/OFL.txt
    - assets/fonts/michroma/OFL.txt

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/sora/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/sora/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/sora/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/sora/Sora-Bold.ttf
          weight: 700
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/hanken_grotesk/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/hanken_grotesk/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/hanken_grotesk/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/hanken_grotesk/HankenGrotesk-Bold.ttf
          weight: 700
    - family: Michroma
      fonts:
        - asset: assets/fonts/michroma/Michroma-Regular.ttf

flutter_launcher_icons:
  android: false
  ios: true
  image_path: assets/app_icon/icon.png
  remove_alpha_ios: true
